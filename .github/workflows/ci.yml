# CI 파이프라인 (S8-05 · 구 T-02b · 명세서 §7.2 · §7.5)
#
# ── 왜 지금인가 ───────────────────────────────────────────────────────────────
# 7단계까지 검증이 **전부 사람 손**이었다. 태스크마다 같은 명령을 다시 돌렸고, 그 사이
# 커버리지 표 오류 둘(T-00k)과 검사 도구 자체의 결함 둘(S7-11)이 사람 눈으로만 발견됐다.
# CI 에서 돌지 않으면 **다음 태스크가 지난 태스크를 조용히 깨뜨린다.**
#
# ── 설계 원칙 ─────────────────────────────────────────────────────────────────
# 1. **로컬에서 돌던 명령을 그대로 부른다.** CI 전용 명령을 새로 만들지 않는다 —
#    만드는 순간 "CI 는 통과하는데 로컬은 실패" 하는 두 번째 진실이 생긴다.
#    아래 모든 step 은 `npm run <script>` 이고, 개발자도 그대로 친다.
# 2. **워크플로 파일은 하나다.** PR 용과 push 용을 나누면 PR 이 초록인데 dev 가 빨간
#    상태가 만들어진다. 트리거만 둘이고 검사는 같다.
# 3. **잡을 셋으로 나눈다.** 빠른 되먹임(quality)과 느린 것(integration)을 한 잡에
#    묶으면 오타 하나를 고치는 데도 전체를 기다린다. 셋은 독립이라 병렬로 돈다.
# 4. **비밀을 파일에 적지 않는다.** 아래 어디에도 키가 없다 — 필요한 값은 방금 띄운
#    로컬 스택이 출력하고 `npm run env:sync` 가 받아 적는다. 스테이징·프로덕션 값이
#    필요해지는 날에는 GitHub Secrets 를 쓴다.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 낡은 결과를 기다릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 빠른 게이트 ─────────────────────────────────────────────────────────────
  # 린트·타입·단위 테스트·문서 집계. 대부분의 실패가 여기서 잡히고 DB 가 필요 없다.
  quality:
    name: quality (lint / types / tests / docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 버전을 여기 적지 않는다. `.nvmrc` 가 진실이고 로컬도 그것을 읽는다.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      # FIX-19 가 여기서 잡히던 자리다. 이 태스크가 두 건을 고쳐 지금은 통과한다 —
      # 앞으로 판별 유니온을 안 좁힌 코드는 여기서 막힌다.
      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm run test

      # §7.2 시크릿 스캔(소스). 클라이언트 번들 검사는 integration 잡에서 한다 —
      # 빌드 산출물이 있어야 하고, **서비스롤 키가 실제로 있는 상태**에서 봐야 뜻이 있다.
      - name: secret scan (source)
        run: npm run check:secrets

      # 커버리지 검증표의 요약과 본문이 어긋났는지 본다. 네 번 연속 사람이 놓친 자리다.
      - name: coverage table (docs/TASKS.md)
        run: npm run check:coverage-table

      - name: asset manifest
        run: npm run assets:check

      # §7.5 는 커버리지 80% 를 요구하지만 `@vitest/coverage-v8` 이 아직 없다
      # (새 npm 의존성이라 S8-05 의 보고 대상이다). 게이트는 **미리 세워 두고**
      # 지금은 막지 않는다 — 설치가 결정되면 `continue-on-error` 한 줄만 지우면 켜진다.
      - name: coverage 80% (준비됨 · provider 미설치라 아직 막지 않는다)
        run: npm run test:coverage
        continue-on-error: true

  # ── 의존성 취약점 ──────────────────────────────────────────────────────────
  # §7.2 · §7.5 "PR 파이프라인 차단 조건". 알려진 것은 security/audit-allowlist.json
  # 에 **사유와 함께** 적혀 있고, 목록에 없는 high/critical 이 나오면 막는다.
  # `--audit-level` 을 낮추는 것과 다른 점이 이것이다 — 그쪽은 등급 전체를 조용히 끈다.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: npm audit (new high/critical blocks)
        run: npm run check:audit

  # ── 빌드 + 번들 유입 + RLS 격리 ────────────────────────────────────────────
  # 셋을 한 잡에 둔 이유는 **전부 살아 있는 Supabase 스택을 필요로 하기 때문**이다.
  #
  # **빌드가 DB 를 필요로 한다는 사실이 이 태스크에서 드러났다.** `/guides` 는
  # `revalidate = 300` 으로 빌드 시점에 프리렌더되고 그때 콘텐츠를 조회한다.
  # DB 가 없으면 `Export encountered errors` 로 빌드가 깨진다. 프로덕션(Vercel)에서는
  # 빌드 시점에 DB 가 닿으므로 정상이고, **그 조건을 CI 도 그대로 만들어야** 로컬·CI·
  # 배포가 같은 뜻이 된다. 화면 코드를 고쳐 우회하지 않았다 — 조회 실패를 조용히
  # 빈 페이지로 넘기면 DB 가 잠깐 흔들린 날 빈 가이드 목록이 배포된다.
  #
  # **`db:rls` 를 매 PR 마다 돌린다.** 느리지만 별도 잡이라 빠른 게이트를 막지 않고,
  # 여기서 놓친 정책 구멍은 **데이터가 새고 나서야** 발견된다.
  #
  # **왜 postgres 서비스 컨테이너가 아닌가.** `db:rls` 는 `auth.uid()` · `authenticated`
  # 롤 · PostgREST · GoTrue 관리 API 를 전부 쓴다. 맨 Postgres 로는 절반이 안 돈다.
  integration:
    name: integration (supabase / build / bundle / db:rls)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 리포의 devDependency 로 들어 있는 CLI 를 그대로 쓴다. 별도 액션을 붙이면
      # 로컬(`npm run db:start`)과 CI 가 다른 CLI 버전을 쓸 수 있다.
      # `supabase start` 가 마이그레이션과 seed.sql 을 함께 적용한다.
      - name: start supabase stack
        run: npx supabase start

      # `.env.local` 을 만든다. **값을 워크플로에 적지 않는다** — 방금 띄운
      # 인스턴스가 출력한 값을 스크립트가 읽어 넣는다.
      - name: sync .env.local from the running stack
        run: npm run env:sync

      # 여기서 `env:check` 가 뜻을 갖는다: 방금 만든 파일이 **실제로 도는 인스턴스와
      # 일치하는지** 확인한다. quality 잡에는 스택이 없어 이 검사가 무의미하다.
      - name: env:check
        run: npm run env:check

      - name: build
        run: npm run build

      # **§7.2 가 이름으로 요구하는 검사다.** "서비스롤 키는 클라이언트 번들 유입
      # 여부를 CI 에서 검사한다." 바로 위 빌드는 `.env.local` 에 **진짜 서비스롤 키가
      # 있는 상태**로 돌았다 — 키가 없는 빌드를 스캔하면 통과가 아무것도 증명하지 않는다.
      - name: client bundle scan (service role key must not ship)
        run: npm run check:bundle

      - name: seed accounts + fixtures
        run: npm run seed:accounts

      - name: db:rls
        run: npm run db:rls

      - name: stop supabase stack
        if: always()
        run: npx supabase stop --no-backup
